# governed-by: ADR-0003
[workspace]
resolver = "2"
members = [
    "crates/toron-core",
    "crates/toron-plane",
    "crates/toron-mcp",
    "crates/toron-cli",
    "crates/toron-e2e",
    "crates/toron-workflow",
]

# cargo 1.9x defaults release to strip="debuginfo". On macOS arm64 that strip
# corrupts the LINKEDIT segment of large proc-macro dylibs (sqlx_macros is
# ~8.8MB) — dyld then rejects them at load with "mis-aligned LINKEDIT string
# pool", breaking `cargo install --release`/`--path` builds of toron.
# Disable stripping (correctness > binary size for this project).
# Dependency debuginfo is the dominant cost of a cold dev build and of every
# relink, and none of it is read: a panic in a dependency still resolves to a
# line table, which is all a backtrace needs. Full debuginfo for deps was the
# default here because no repo set a `[profile.dev.package]` override.
[workspace.dependencies]
rmcp = "3.11.0"
rmcp-macros = "3.11.0"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
strip = "none"
