[package]
name = "toron"
version = "0.1.0"
edition = "2021"

[dependencies]
asupersync = { version = "0.3.1", features = ["quic", "tls", "proc-macros"] }
asupersync-macros = "0.3.1"
resonate-sdk = "0.4.0"
resonate-sdk-macros = "0.1.0"
mdns-sd = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12.3"
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
rcgen = "0.13"
asupersync-tokio-compat = { version = "0.3.1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[governance]
adr = "0001"
# governed-by: ADR-0001
