# governed-by: ADR-0003
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: ADR-0003 gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify ADR-0003 gates (no asupersync/fastmcp, forbid unsafe)
        run: bash scripts/verify-gates.sh

  build:
    name: cargo check/test/clippy/fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Follows rust-toolchain.toml (floating nightly, operator choice
          # 2026-09-06; was pinned nightly-2026-08-20 per bd-14ea).
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check --workspace
        run: cargo check --workspace
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --check

  # ADR-0041: the Lean model of the comms log + delivery FSM. Proves P1/P2,
  # regenerates the vectors and checks the committed copies match, so the
  # Rust tests (tests/proto_vectors.rs) never run against stale vectors.
  lean:
    name: Lean proto (lake build + vector freshness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan (toolchain from proto/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (theorems, no sorry)
        run: |
          lake build 2>&1 | tee build.log
          ! grep -n "declaration uses 'sorry'" build.log
      - name: delivery vectors are fresh
        run: lake exe proto vectors --check vectors/delivery.jsonl
      - name: log traces are fresh
        run: lake exe proto log-traces --check vectors/log_traces.jsonl

  e2e-p1:
    name: toron-e2e P1 gate (requires herdr stack on runner)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Follows rust-toolchain.toml (floating nightly).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build toron CLI binary (cli e2e shells target/debug/toron)
        run: cargo build -p toron-cli --bin toron
      - name: cargo test -p toron-e2e --features p1
        run: cargo test -p toron-e2e --features p1

  # P2 gate — gates the Resonate-backed workflow differentiator (SC-11 WF-08
  # crash-resume). SC-11 spawns a real `resonate serve` subprocess; the binary
  # is installed here so the differentiator test runs on every push/PR, not
  # just locally. (bd-quo: the headline claim must be CI-witnessed.)
  e2e-p2:
    name: toron-e2e P2 gate (requires resonate + herdr stack on runner)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Follows rust-toolchain.toml (floating nightly).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install resonate CLI (for SC-11 subprocess)
        run: cargo install resonate --locked || echo 'resonate install skipped (SC-11 skips when binary absent)'
      - name: Build toron CLI binary (cli e2e shells target/debug/toron)
        run: cargo build -p toron-cli --bin toron
      - name: cargo test -p toron-e2e --features p2
        run: cargo test -p toron-e2e --features p2
