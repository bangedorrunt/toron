# governed-by: ADR-0003
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: ADR-0003 gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Verify ADR-0003 gates (no asupersync/fastmcp, forbid unsafe)
        run: bash scripts/verify-gates.sh

  build:
    name: cargo check/test/clippy/fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace
        run: cargo check --workspace
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --check

  e2e-p1:
    name: toron-e2e P1 gate (requires herdr stack on runner)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build toron CLI binary (cli e2e shells target/debug/toron)
        run: cargo build -p toron-cli --bin toron
      - name: cargo test -p toron-e2e --features p1
        run: cargo test -p toron-e2e --features p1

  # P2 gate — gates the Resonate-backed workflow differentiator (SC-11 WF-08
  # crash-resume). SC-11 spawns a real `resonate serve` subprocess; the binary
  # is installed here so the differentiator test runs on every push/PR, not
  # just locally. (bd-quo: the headline claim must be CI-witnessed.)
  e2e-p2:
    name: toron-e2e P2 gate (requires resonate + herdr stack on runner)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install resonate CLI (for SC-11 subprocess)
        run: cargo install resonate --locked || echo 'resonate install skipped (SC-11 skips when binary absent)'
      - name: Build toron CLI binary (cli e2e shells target/debug/toron)
        run: cargo build -p toron-cli --bin toron
      - name: cargo test -p toron-e2e --features p2
        run: cargo test -p toron-e2e --features p2
