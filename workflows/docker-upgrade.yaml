# Weekly health-gated Docker image upgrade with auto-rollback
# (saga replacement — ADR-0005 Spec 3, bd-p4-migrate-sagas-7rmo)
#
# Replaces the systemd docker-auto-upgrade timer (Sun 03:30). Passes the SAME
# health-gates as the bash saga: after the upgrade, probes aiostreams /
# the in-house engine store / honcho / pihole / dnscrypt-proxy. A dead
# service (any probe fails) FAILS the run -> on_failure: bead -> the defined
# fixer (housekeeper-diagnose) reads the bundle and proposes a patch.
# Declarative + replayable via the unified engine.
#
# Deploy: copy to ~/.config/flywheel/workflows/.
name: docker-upgrade
description: "Weekly health-gated Docker image upgrade with auto-rollback (saga replacement, ADR-0005 Spec 3)."
trigger:
  type: schedule
  cron: "30 3 * * 0"
  owner: housekeeper
  scope: host
policy:
  on_failure: bead
  on_repeat_failure: escalate
  repeat_threshold: 3
  on_success: log
  max_retries: 1
  no_claim_timeout: 600
steps:
  - name: snapshot
    action: spawn
    profile: "@housekeeper"
    workflow: housekeeper-snapshot
    await: true
    no_claim_timeout: 600
    on_error: fail_run
  - name: upgrade
    action: spawn
    profile: "@housekeeper"
    workflow: housekeeper-docker-upgrade
    await: true
    no_claim_timeout: 600
    on_error: fail_run
  # The saga's five health-gates, probed on their host ports (docker-stack
  # compose). Each probe is a shell `verify` with on_error: fail_run — a dead
  # service exits non-zero and FAILS the run (Spec 0), so `on_failure: bead`
  # fires with the failing step in the bundle. `call_webhook` is unsupported
  # by contract; the engine-store gate replaces the old vendor /health probe.
  - name: gate-aiostreams
    action: verify
    command: "curl -fsS --max-time 5 http://127.0.0.1:3000/health >/dev/null"
    on_error: fail_run
  - name: gate-engine-store
    action: verify
    command: "flywheel deps >/dev/null"
    on_error: fail_run
  - name: gate-honcho
    action: verify
    command: "curl -fsS --max-time 5 -X POST http://127.0.0.1:8010/health >/dev/null"
    on_error: fail_run
  - name: gate-pihole
    action: verify
    command: "curl -fsS --max-time 5 http://127.0.0.1:80/admin >/dev/null"
    on_error: fail_run
  - name: gate-dnscrypt
    action: verify
    command: "curl -fsS --max-time 5 http://127.0.0.1:5053/ >/dev/null"
    on_error: fail_run
  - name: notify-ok
    action: send_dm
    to: housekeeper
    body: "docker-upgrade OK — all 5 health gates passed (aiostreams/engine-store/honcho/pihole/dnscrypt)"
