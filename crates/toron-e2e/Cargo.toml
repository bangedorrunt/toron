# governed-by: ADR-0003
[package]
name = "toron-e2e"
version = "1.2.1"
edition = "2024"

[features]
# v1 gate: SC-1..SC-8 + SC-14a
p1 = []
# Phase-2 gate: SC-9..SC-13
p2 = []
# P5 gate: ADR-0005 durable concurrency + replay-determinism spike (SC-16)
p5 = []
# P4 gate: ADR-0005 smart-cron behavior rows (SC-18..SC-25) + shared fixtures
p4 = ["p5"]

[dependencies]
toron-core = { path = "../toron-core" }
tokio = { version = "1", features = ["full"] }
nostr-sdk = "0.45.2"
nostr = { version = "0.45.3", features = ["nip44", "nip59", "os-rng"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
serde_json = "1"

[dev-dependencies]
toron-workflow = { path = "../toron-workflow" }
nostr-sdk = "0.45.2"
nostr = { version = "0.45.3", features = ["nip44", "nip59", "os-rng"] }
