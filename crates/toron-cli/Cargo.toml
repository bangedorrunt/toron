# governed-by: ADR-0003
[package]
name = "toron-cli"
version = "1.3.2"
edition = "2024"

[[bin]]
name = "toron"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmcp = { version = "3.2.0", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
toron-core = { path = "../toron-core" }
toron-mcp = { path = "../toron-mcp" }
toron-workflow = { path = "../toron-workflow" }
nostr = { version = "0.45.3", features = ["nip44", "nip59", "os-rng"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

[lints]
workspace = true
