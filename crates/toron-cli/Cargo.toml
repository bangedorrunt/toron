# governed-by: ADR-0003
[package]
name = "toron-cli"
version = "1.5.0"
edition = "2024"

[[bin]]
name = "toron"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmcp = { version = "3.4.0", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
toron-core = { path = "../toron-core" }
toron-mcp = { path = "../toron-mcp" }
toron-workflow = { path = "../toron-workflow" }
nostr = { version = "0.45.3", features = ["nip44", "nip59", "os-rng"] }
# `doctor` reads the resonate /health of the resolved server. The SDK that
# actually talks to that server (resonate-sdk) uses reqwest, so the probe uses
# it too — same TLS stack and trust store the runtime uses. `blocking` is the
# only addition; the rest is already in the graph via rmcp.
reqwest = { version = "0.13", features = ["blocking"] }
ratatui = "0.29"
crossterm = "0.28"

[features]
# ADR-0041 live test (c) only: `TORON_FAULT=after_intent|after_append`
# aborts `toron inbox send` at that point. Never in a release build.
fault-injection = ["toron-core/fault-injection"]

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
