# governed-by: ADR-0003
[package]
name = "toron-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "toron"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
toron-core = { path = "../toron-core" }
toron-mcp = { path = "../toron-mcp" }
