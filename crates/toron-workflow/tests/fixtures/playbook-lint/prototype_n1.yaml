# Failure mode: prototype with n=1 (ADR-0019 Spec 6: exhaust-the-design-space).
name: prototype
description: single arm is not a comparison
inputs:
  - name: question
  - name: n
    default: 1
  - name: mode
    default: sketch
steps:
  - name: arms
    action: parallel
    over: "{{inputs.n}}"
    each: { action: dispatch_job, assignee: x, spec: { profile: "@coder", task: "NON-COMPILING design sketch: API shapes, state machines, tradeoff table. /tmp/flywheel-proto-<run>-<arm>/ text only. No crate copy, no br." } }
  - name: judge
    action: dispatch_job
    assignee: x
    spec: { profile: "@oracle", task: "compare arms on named criteria; pick one" }
