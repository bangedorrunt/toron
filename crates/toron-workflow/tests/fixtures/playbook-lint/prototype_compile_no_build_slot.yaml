# Failure mode: compile-mode prototype without build-slot serialization
# declaration (ADR-0019 Spec 7.2 amendment 2026-08-15: compiling variants pay
# the serialize rule).
name: prototype
description: compile arms without build slot
inputs:
  - name: question
  - name: n
    default: 2
  - name: mode
    default: compile
steps:
  - name: arms
    action: parallel
    over: "{{inputs.n}}"
    each: { action: dispatch_job, assignee: x, spec: { profile: "@coder", task: "compile and measure arm {{inputs.question}}" } }
  - name: judge
    action: dispatch_job
    assignee: x
    spec: { profile: "@oracle", task: "compare arms on named criteria; pick one" }
