# Failure mode: forensics workflow containing a fix step (ADR-0019 Spec 7.2:
# "I said repro, I did not ask for a fix").
name: forensics
description: diagnosis plus a fix
steps:
  - name: diagnose
    action: dispatch_job
    assignee: x
    spec: { profile: "@scout", task: "instrumentation or artifact read; deliverable is a diagnosis" }
  - name: fix
    action: dispatch_job
    assignee: x
    spec: { profile: "@coder", task: "patch the root cause" }
