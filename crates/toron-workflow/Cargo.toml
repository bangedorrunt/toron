# governed-by: ADR-0003
[package]
name = "toron-workflow"
version = "1.4.0"
edition = "2024"

[dependencies]
toron-core = { path = "../toron-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
evalexpr = "13.1.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
parking_lot = "0.12.5"
nostr-sdk = "0.45.2"
nostr = { version = "0.45.3", features = ["nip44", "nip59", "os-rng"] }
resonate-sdk = "0.6"
resonate-sdk-macros = "0.1"
anyhow = "1.0.104"
cron = "0.17.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
# bd-6wfv: bound-but-not-listening socket for the deterministic dead-port
# probe (a freed ephemeral port can be rebound by a concurrent test binary;
# a socket bound WITHOUT listen refuses connections deterministically).
socket2 = "0.6"

[lints]
workspace = true
