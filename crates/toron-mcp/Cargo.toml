# governed-by: ADR-0003
[package]
name = "toron-mcp"
version = "1.3.2"
edition = "2024"

[dependencies]
rmcp = { version = "3.2.0", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "transport-worker",
    "transport-streamable-http-client-reqwest",
    "client",
] }
toron-core = { path = "../toron-core" }
toron-workflow = { path = "../toron-workflow" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evalexpr = "13.1.0"
nostr-sdk = "0.45.2"
nostr = { version = "0.45.3", features = ["nip44", "nip49", "nip59", "os-rng"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

[dev-dependencies]
async-trait = "0.1"
tower = "0.5"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[lints]
workspace = true
