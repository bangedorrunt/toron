# governed-by: ADR-0003
[package]
name = "toron-mcp"
version = "1.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.1.1", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "transport-worker",
    "transport-streamable-http-client-reqwest",
    "client",
] }
schemars = "0.8"
toron-core = { path = "../toron-core" }
toron-workflow = { path = "../toron-workflow" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evalexpr = "13.1.0"
nostr-sdk = { version = "0.44", features = ["nip44", "nip49", "nip59"] }

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
uuid = { version = "1", features = ["v4"] }
