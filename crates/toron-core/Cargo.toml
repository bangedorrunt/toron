# governed-by: ADR-0003
[package]
name = "toron-core"
version = "1.3.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
tokio-tungstenite = "0.24"
axum = "0.7"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
nostr-sdk = "0.45.2"
nostr = { version = "0.45.3", features = ["nip44", "nip49", "nip59", "os-rng"] }
negentropy = "0.5"
hex = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
sha2 = "0.10"

[dev-dependencies]
proptest = "1.11"
futures-util = "0.3"
