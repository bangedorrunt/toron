# governed-by: ADR-0003, ADR-0040
[package]
name = "toron-core"
version = "1.6.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
tokio-tungstenite = "0.24"
parking_lot = "0.12"
# Read-mostly key caches (key_cache, alt_key_paths) are lock-free reads:
# their critical sections are one hash lookup, and readers used to queue
# behind the poller. NOT for values mutated in place.
papaya = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
nostr-sdk = "0.45.2"
nostr = { version = "0.45.3", features = ["nip44", "nip49", "nip59", "os-rng"] }
negentropy = "0.5"
hex = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
sha2 = "0.10"
schemars = "1"
# Comms kernel (ADR-0040): elm-effect-rs Elm + journal + durable engine layer, tracked live from
# the sibling workspace (same shape as chiebukuro and beads; no vendored copy).
# Only `kernel.rs` names these.
elm-effect = { path = "../../../elm-effect-rs/crates/elm-effect" }
elm-effect-durable = { path = "../../../elm-effect-rs/crates/elm-effect-durable" }
elm-effect-elm = { path = "../../../elm-effect-rs/crates/elm-effect-elm" }
elm-effect-journal = { path = "../../../elm-effect-rs/crates/elm-effect-journal" }

[features]
# Test-only crash points for the comms outbox (TORON_FAULT=after_intent |
# after_append aborts the process there). Never enabled in a release build;
# the dev-dependency below turns it on for this crate's own tests only.
fault-injection = []

[dev-dependencies]
tempfile = "3"
toron-core = { path = ".", features = ["fault-injection"] }
proptest = "1.11"
futures-util = "0.3"
